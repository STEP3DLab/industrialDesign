ServerName localhost
ServerTokens Prod
ServerSignature Off
<Directory /var/www/html>
    Options -Indexes
    AllowOverride None
    Require all granted
</Directory>
<DirectoryMatch "/(cli|tests|fixtures|node_modules|vendor)(/|$)">
    Require all denied
</DirectoryMatch>
<FilesMatch "^(config\.php|composer\.(json|lock)|package(-lock)?\.json|phpunit.*|\.env.*)$">
    Require all denied
</FilesMatch>
